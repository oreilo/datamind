services:
  datamind:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATAMIND_API_KEY: ${DATAMIND_API_KEY:?Set DATAMIND_API_KEY in .env}
      DATAMIND_DATA_DIR: /app/data
    volumes:
      - datamind_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  datamind_data:
